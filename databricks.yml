# This is a Declarative Automation Bundle definition for rotaperfume.
# Bundle da Noite 2 da Imersão Jornada de Dados — nasce vazio e ganha uma
# camada por prompt (raw → bronze → silver → gold → dashboard → Genie).
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: rotaperfume
  uuid: 8bcbbfc4-3fc8-457c-aa58-0377984ff2b0

include:
  - resources/*.yml

variables:
  catalog:
    description: O catálogo Unity Catalog usado pelo projeto
    default: lakehouse_rotaperfume
  warehouse_id:
    description: O SQL Warehouse serverless usado pelas tarefas SQL
    default: 0f112ef6af345993

targets:
  dev:
    default: true
    # ARMADILHA: NÃO use `mode: development` aqui. Ele prefixa o nome de todo
    # recurso implantado com "[dev seu_usuario]" — inclusive os SCHEMAS do
    # Unity Catalog, que virariam "dev_gabriela_bronze" e quebrariam todo o
    # SQL da noite (que sempre referencia lakehouse_rotaperfume.bronze etc.).
    # Em vez de mode: development, pausamos o agendamento explicitamente.
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-451ddd41-f807.cloud.databricks.com
    variables:
      catalog: lakehouse_rotaperfume
      warehouse_id: 0f112ef6af345993

  prod:
    mode: production
    workspace:
      host: https://dbc-451ddd41-f807.cloud.databricks.com
      root_path: /Workspace/Users/gcdesouza.contabeis@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_rotaperfume
      warehouse_id: 0f112ef6af345993
    permissions:
      - user_name: gcdesouza.contabeis@gmail.com
        level: CAN_MANAGE
