# rotaperfume_pipeline — o job cresce uma tarefa por prompt da noite 2:
#
#   prompt 1 (hoje)  raw_conferencia
#   prompt 2         + bronze_ingestao
#   prompt 3         + silver ×4 (paralelo)
#   prompt 4         + gold_dimensoes, gold_fato_vendas, gold_marts, testes
#   prompt 5         (dashboard, não entra no job)
#   prompt 6         + views de negócio e auditoria de metadado
#
# Hoje ele fecha com DOZE tarefas: raw, bronze, as quatro de silver em
# paralelo, a cadeia da gold (dimensões, fato, marts), e dali em diante DUAS
# ramificações em paralelo — testes (qualidade) e metricas_de_negocio →
# auditoria_de_metadado (as views de negócio e a checagem de que nenhuma
# ficou sem COMMENT). Metadado faltando é bug, e quebra o job igual a um
# teste de qualidade.
resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline

      schedule:
        quartz_cron_expression: "0 0 6 * * ?" # todo dia às 6h
        timezone_id: America/Sao_Paulo

      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
          # Sem cluster nem environment_key: no Free Edition o job roda em
          # compute serverless por padrão, e o notebook_task não precisa
          # de spec de ambiente para isso.

        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          # A ordem é o conteúdo: se a conferência falhar (arquivo ausente
          # ou vazio), a bronze nem começa a rodar.
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql

        - task_key: silver_itens_e_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql

        - task_key: silver_crm_e_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql

        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql

        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql

        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql

        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql

        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql

        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-auditoria-metadado.sql
